<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta charset="utf-8" />
  <link rel="icon" href="./splash.png">
  <link rel="shortcut icon" href="./splash.png">
  <title>Amidst the Clouds</title>
  <script src="/js/main.js"></script>

  <style>
    html, body {
      background: #000;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      image-rendering: optimizeSpeed;
      -webkit-interpolation-mode: nearest-neighbor;
      -ms-touch-action: none;
      display: block;
      background: #000;
      width: 100%;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
    }

    div.gm4html5_div_class {
      margin: 0;
      padding: 0;
      border: 0;
    }

    div.gm4html5_login {
      padding: 20px;
      position: absolute;
      border: solid 2px #000000;
      background-color: #404040;
      color: #00ff00;
      border-radius: 15px;
      box-shadow: #101010 20px 20px 40px;
    }

    div.gm4html5_cancel_button {
      float: right;
    }

    div.gm4html5_login_button {
      float: left;
    }

    div.gm4html5_login_header {
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <img src="Clouds/splash.png" id="GM4HTML5_loadingscreen" alt="GameMaker:HTML5 loading screen" style="display: none;" />
    <canvas id="canvas" width="800" height="600">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>

  <script src="Clouds/Clouds.js"></script>
  <script>
    function resizeCanvas() {
      const canvas = document.getElementById("canvas");
      const aspect = 800 / 600;
      const windowAspect = window.innerWidth / window.innerHeight;

      if (windowAspect > aspect) {
        canvas.style.height = "100vh";
        canvas.style.width = (100 * aspect / windowAspect) + "vh";
      } else {
        canvas.style.width = "100vw";
        canvas.style.height = (100 / aspect * windowAspect) + "vw";
      }
    }

    window.addEventListener("resize", resizeCanvas);
    window.onload = () => {
      GameMaker_Init();
      resizeCanvas();
    };
  </script>
</body>
</html>
